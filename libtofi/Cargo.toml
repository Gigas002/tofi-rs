[package]
name = "libtofi-rs"
version = "0.1.0"
edition.workspace = true

[dependencies]
thiserror = "2"
unicode-normalization = "0.1"

# §4.1 / docs/RUST_MIGRATION_PLAN.md — engine + renderer feature split.
[features]
default = [
    "wayland",
    "renderer",
    "drun",
    "clipboard",
    "history",
    "single-instance-lock",
    "run-commands",
]
wayland = []
renderer = []
drun = []
run-commands = []
# Paste implementation lives under `wayland::clipboard`; enabling implies `wayland`.
clipboard = ["wayland"]
history = []
single-instance-lock = []
