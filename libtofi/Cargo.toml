[package]
name = "libtofi-rs"
version = "1.0.0"
description = "Core library for the tofi Wayland application launcher"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["wayland", "launcher", "tofi", "layer-shell"]
categories = ["gui"]

[dependencies]
thiserror = "2"
unicode-normalization = "0.1"
rustix = { version = "1", features = ["fs", "mm", "pipe"] }
walkdir = "2"
tracing = "0.1"
# Wayland stack — all three must resolve to the same wayland-client major.
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
# XKB keyboard state — keymap parsing and modifier tracking.
xkbcommon = { version = "0.9", optional = true }
# Renderer stack (tiny-skia + cosmic-text / harfrust / fontdb / swash).
tiny-skia = { version = "0.12", optional = true }
cosmic-text = { version = "0.19", default-features = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = [
    "wayland",
    "renderer",
    "logging",
]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:xkbcommon"]
# Drawing stack: tiny-skia raster + cosmic-text layout.
renderer = ["dep:tiny-skia", "dep:cosmic-text"]
# Paste implementation lives under `wayland::clipboard`; enabling implies `wayland`.
clipboard = ["wayland"]
# Tracing instrumentation — zero-cost when disabled (no subscriber is registered).
logging = []
