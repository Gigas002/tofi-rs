[package]
name = "libtofi-rs"
version = "0.1.0"
edition.workspace = true

[dependencies]
thiserror = "2"
unicode-normalization = "0.1"
nix = { version = "0.29", features = ["fs"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

# §4.1 / docs/RUST_MIGRATION_PLAN.md — engine + renderer feature split.
[features]
default = [
    "wayland",
    "renderer",
    "drun",
    "clipboard",
    "single-instance-lock",
]
wayland = []
renderer = []
drun = []
# Paste implementation lives under `wayland::clipboard`; enabling implies `wayland`.
clipboard = ["wayland"]
single-instance-lock = []
