[package]
name = "libtofi-rs"
version = "0.1.0"
edition.workspace = true

[dependencies]
thiserror = "2"
unicode-normalization = "0.1"
nix = { version = "0.31", features = ["fs", "mman"] }
walkdir = "2"
tracing = "0.1"
# Wayland stack — all three must resolve to the same wayland-client major (§3.1).
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
# XKB keyboard state — keymap parsing and modifier tracking (§3.6).
xkbcommon = { version = "0.9", optional = true }
# Renderer stack (Cairo + Pango + HarfBuzz) — §3.2, §4.1.
# All three share the same gtk-rs minor (0.22) so version resolution is consistent.
cairo-rs = { version = "0.22", optional = true }
pango = { version = "0.22", features = ["v1_42"], optional = true }
pangocairo = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"

# §4.1 / docs/RUST_MIGRATION_PLAN.md — engine + renderer feature split.
[features]
default = [
    "wayland",
    "renderer",
    "drun",
    "clipboard",
    "single-instance-lock",
]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:xkbcommon"]
# Drawing stack: Cairo ImageSurface + Pango text layout (§3.2, §5.1+).
renderer = ["dep:cairo-rs", "dep:pango", "dep:pangocairo"]
drun = []
# Paste implementation lives under `wayland::clipboard`; enabling implies `wayland`.
clipboard = ["wayland"]
single-instance-lock = []
