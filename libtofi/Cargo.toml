[package]
name = "libtofi-rs"
version = "0.10.0"
description = "Core library for the tofi Wayland application launcher"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["wayland", "launcher", "tofi", "layer-shell"]
categories = ["gui"]

[dependencies]
thiserror = "2"
unicode-normalization = "0.1"
rustix = { version = "1", features = ["fs", "mm", "pipe"] }
walkdir = "2"
tracing = "0.1"
# Wayland stack — all three must resolve to the same wayland-client major.
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
# XKB keyboard state — keymap parsing and modifier tracking.
xkbcommon = { version = "0.9", optional = true }
# Renderer stack (Cairo + Pango + HarfBuzz).
# All three share the same gtk-rs minor (0.22) so version resolution is consistent.
cairo-rs = { version = "0.22", optional = true }
pango = { version = "0.22", features = ["v1_42"], optional = true }
pangocairo = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = [
    "wayland",
    "renderer",
    "clipboard",
]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:xkbcommon"]
# Drawing stack: Cairo ImageSurface + Pango text layout.
renderer = ["dep:cairo-rs", "dep:pango", "dep:pangocairo"]
# Paste implementation lives under `wayland::clipboard`; enabling implies `wayland`.
clipboard = ["wayland"]
