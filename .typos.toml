# Spell check for docs and Rust; legacy C/Meson trees are excluded until Phase 9.
[files]
extend-exclude = [
  "src/**",
  "test/**",
  "protocols/**",
  "themes/**",
  "doc/**",
]

[default.extend-words]
# Test strings used as matching algorithm fixtures (e.g. prefix of "foot").
fo = "fo"
# Standard OpenType font variation axis tags (4-char codes, not English words).
wdth = "wdth"
ratatui = "ratatui"
