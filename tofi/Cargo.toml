[package]
name = "tofi-rs"
version = "1.0.0"
description = "A Wayland application launcher — Rust port of tofi"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["wayland", "launcher", "tofi", "drun"]
categories = ["command-line-utilities"]

[[bin]]
name = "tofi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Features mirror libtofi-rs; `default-features = false` so this crate's `[features]` control the library.
libtofi-rs = { path = "../libtofi", default-features = false }
rustix = { version = "1", features = ["event"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap_complete = { version = "4", optional = true }
clap_complete_nushell = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = [
    "wayland",
    "renderer",
    "history",
]
wayland = ["libtofi-rs/wayland"]
renderer = ["libtofi-rs/renderer"]
clipboard = ["libtofi-rs/clipboard"]
history = []
completions = ["dep:clap_complete", "dep:clap_complete_nushell"]
